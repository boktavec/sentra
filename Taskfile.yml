version: '3'

includes:
  web:
    taskfile: ./apps/web/Taskfile.yml
    dir: ./apps/web
  api:
    taskfile: ./apps/api/Taskfile.yml
    dir: ./apps/api
  stack:
    taskfile: ./infra/docker/Taskfile.yml
    dir: ./infra/docker
  platform:
    taskfile: ./packages/ts-platform/Taskfile.yml
    dir: ./packages/ts-platform
  crawler:
    taskfile: ./services/crawler/Taskfile.yml
    dir: ./services/crawler
  pipeline:
    taskfile: ./services/pipeline/Taskfile.yml
    dir: ./services/pipeline
  intelligence:
    taskfile: ./services/intelligence/Taskfile.yml
    dir: ./services/intelligence

tasks:
  setup:
    desc: Sync dependencies for scaffolded services
    cmds:
      - task: web:setup
      - task: api:setup
      - task: platform:setup
      - task: crawler:setup
      - task: pipeline:setup
      - task: intelligence:setup

  lint:
    desc: Lint scaffolded services
    cmds:
      - python3 -m json.tool package.json > /dev/null
      - task --list > /dev/null
      - git diff --check HEAD
      - task: web:lint
      - task: api:lint
      - task: platform:lint
      - task: crawler:lint
      - task: pipeline:lint
      - task: intelligence:lint

  format:
    desc: Format scaffolded services
    cmds:
      - task: web:format
      - task: api:format
      - task: platform:format
      - task: crawler:format
      - task: pipeline:format
      - task: intelligence:format

  format:check:
    desc: Check formatting without modifying files
    cmds:
      - git diff --check HEAD
      - task: web:format:check
      - task: api:format:check
      - task: platform:format:check
      - task: crawler:format:check
      - task: pipeline:format:check
      - task: intelligence:format:check

  typecheck:
    desc: Typecheck scaffolded services
    cmds:
      - task: web:typecheck
      - task: api:typecheck
      - task: platform:typecheck
      - task: crawler:typecheck
      - task: pipeline:typecheck
      - task: intelligence:typecheck

  test:
    desc: Run unit tests for scaffolded services
    cmds:
      - task: web:test
      - task: api:test
      - task: platform:test
      - task: crawler:test
      - task: pipeline:test
      - task: intelligence:test

  test:integration:
    desc: Run integration tests (needs `task stack:up` and `task stack:bootstrap`)
    cmds:
      - task: api:test:integration
      - task: web:test:e2e

  check:
    desc: Run the fast pre-PR checks in order
    cmds:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: test

  fallow:
    desc: Audit changes against main for dead code, duplication, and complexity (fix findings, don't suppress)
    cmds:
      - fallow audit --base origin/main

  check:full:
    desc: Run fast checks, fallow audit, and secret scanning (working tree and branch history)
    cmds:
      - task: check
      - task: fallow
      - task: security
      - task: security:history

  security:
    desc: Scan the working tree for secrets
    cmds:
      - gitleaks dir --no-banner --redact .

  security:history:
    desc: Scan commits on this branch (BASE..HEAD, default origin/main) for secrets, including ones later deleted
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      # gitleaks exits 0 ("0 commits scanned") when the base ref is missing, so fail closed here.
      - cmd: |
          git rev-parse --verify --quiet '{{.BASE}}^{commit}' > /dev/null || {
            echo "base ref {{.BASE}} not found; fetch full history (git fetch origin)" >&2
            exit 1
          }
      - gitleaks git --no-banner --redact --log-opts="{{.BASE}}..HEAD" .

  github:ruleset:
    desc: Apply .github/rulesets/main.json to this repo (admin gh login; run by hand, never from CI)
    vars:
      REPO:
        sh: gh repo view --json nameWithOwner --jq .nameWithOwner
      RULESET_NAME:
        sh: python3 -c 'import json; print(json.load(open(".github/rulesets/main.json"))["name"])'
      RULESET_ID:
        sh: gh api "repos/{{.REPO}}/rulesets?includes_parents=false" --jq '.[] | select(.name == "{{.RULESET_NAME}}") | .id'
    cmds:
      - |
        if [ "$(printf '%s\n' "{{.RULESET_ID}}" | grep -c .)" -gt 1 ]; then
          echo "more than one ruleset named {{.RULESET_NAME}}; delete duplicates in Settings > Rules" >&2
          exit 1
        fi
        if [ -n "{{.RULESET_ID}}" ]; then
          gh api --method PUT "repos/{{.REPO}}/rulesets/{{.RULESET_ID}}" --input .github/rulesets/main.json > /dev/null
          echo "updated ruleset {{.RULESET_NAME}} ({{.RULESET_ID}})"
        else
          gh api --method POST "repos/{{.REPO}}/rulesets" --input .github/rulesets/main.json > /dev/null
          echo "created ruleset {{.RULESET_NAME}}"
        fi

  hooks:install:
    desc: Install the fast pre-commit hooks
    cmds:
      - pre-commit install

  clean:
    desc: Remove generated caches and build output, preserving environments and data
    cmds:
      - rm -rf .task .pytest_cache .ruff_cache .mypy_cache .pyright coverage htmlcov dist build
      - rm -rf apps/web/.next apps/web/coverage apps/web/dist apps/api/coverage apps/api/dist
      - rm -rf services/crawler/.pytest_cache services/crawler/.ruff_cache services/pipeline/.pytest_cache services/pipeline/.ruff_cache services/intelligence/.pytest_cache services/intelligence/.ruff_cache

  tasks:
    desc: List available commands
    cmds:
      - task --list
