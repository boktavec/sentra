version: "3"

tasks:
  up:
    desc: Start the local stack (Zitadel, Postgres, Redis, Mailpit, Redpanda, SeaweedFS) and wait until healthy
    cmds:
      - "[ -f .env ] || cp .env.example .env"
      - docker compose --env-file .env -f compose.yml up -d --wait

  down:
    desc: Stop the local stack, keeping data volumes
    cmds:
      - docker compose --env-file .env -f compose.yml down

  reset:
    desc: Stop the local stack and delete its data volumes
    cmds:
      - docker compose --env-file .env -f compose.yml down -v

  logs:
    desc: Tail logs for the local stack
    cmds:
      - docker compose --env-file .env -f compose.yml logs -f --tail=100

  ps:
    desc: Show local stack status
    cmds:
      - docker compose --env-file .env -f compose.yml ps

  bootstrap:
    desc: Configure Zitadel (project, OIDC app, policies, SMTP); writes gitignored .env.sentra
    cmds:
      - node bootstrap-zitadel.mjs

  crawler-role:
    desc: Give the sentra_crawler Postgres role (created by migration 006) a local login password
    cmds:
      - |
        set -a; . ./.env; set +a
        docker compose --env-file .env -f compose.yml exec -T sentra-postgres \
          psql -U sentra -d sentra -v ON_ERROR_STOP=1 \
          -c "ALTER ROLE sentra_crawler LOGIN PASSWORD '$CRAWLER_DB_PASSWORD'"

  scheduler-role:
