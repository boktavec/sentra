version: "3"

tasks:
  setup:
    desc: setup apps/web
    cmds:
      - 'if [ -f package.json ]; then pnpm install; else echo "apps/web has not been scaffolded yet; skipping."; fi'

  lint:
    desc: lint apps/web
    cmds:
      - 'if [ -f package.json ]; then pnpm run lint; else echo "apps/web has not been scaffolded yet; skipping."; fi'

  format:
    desc: format apps/web
    cmds:
      - 'if [ -f package.json ]; then pnpm run format; else echo "apps/web has not been scaffolded yet; skipping."; fi'

  format:check:
    desc: format:check apps/web
    cmds:
      - 'if [ -f package.json ]; then pnpm run format:check; else echo "apps/web has not been scaffolded yet; skipping."; fi'

  typecheck:
    desc: typecheck apps/web
    cmds:
      - 'if [ -f package.json ]; then pnpm run typecheck; else echo "apps/web has not been scaffolded yet; skipping."; fi'

  test:
    desc: test apps/web
    cmds:
      - 'if [ -f package.json ]; then pnpm run test; else echo "apps/web has not been scaffolded yet; skipping."; fi'

  test:e2e:
    desc: Playwright sign-in E2E (needs `task stack:up` and `task stack:bootstrap`)
    cmds:
      - pnpm run test:e2e

  dev:
    desc: Run apps/web against the local stack
    cmds:
      - pnpm run dev
