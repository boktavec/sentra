version: "3"

tasks:
  setup:
    desc: setup apps/api
    cmds:
      - 'if [ -f package.json ]; then pnpm install; else echo "apps/api has not been scaffolded yet; skipping."; fi'

  lint:
    desc: lint apps/api
    cmds:
      - 'if [ -f package.json ]; then pnpm run lint; else echo "apps/api has not been scaffolded yet; skipping."; fi'

  format:
    desc: format apps/api
    cmds:
      - 'if [ -f package.json ]; then pnpm run format; else echo "apps/api has not been scaffolded yet; skipping."; fi'

  format:check:
    desc: format:check apps/api
    cmds:
      - 'if [ -f package.json ]; then pnpm run format:check; else echo "apps/api has not been scaffolded yet; skipping."; fi'

  typecheck:
    desc: typecheck apps/api
    cmds:
      - 'if [ -f package.json ]; then pnpm run typecheck; else echo "apps/api has not been scaffolded yet; skipping."; fi'

  test:
    desc: test apps/api
    cmds:
      - 'if [ -f package.json ]; then pnpm run test; else echo "apps/api has not been scaffolded yet; skipping."; fi'

  test:integration:
    desc: Integration tests for apps/api (needs `task stack:up` and `task stack:bootstrap`)
    cmds:
      - pnpm run test:integration

  dev:
    desc: Run apps/api with auto-reload against the local stack
    cmds:
      - pnpm run dev
