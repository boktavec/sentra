[project]
name = "sentra-intelligence"
version = "0.1.0"
description = "Tenant-scoped investigation worker"
requires-python = ">=3.14"
dependencies = [
  "confluent-kafka>=2.16.0",
  "httpx>=0.28.0",
  "prometheus-client>=0.26.0",
  "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8.4", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
