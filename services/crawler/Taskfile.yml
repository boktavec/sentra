version: '3'

tasks:
  setup:
    desc: setup services/crawler
    cmds:
      - 'if [ -f pyproject.toml ]; then uv sync; else echo "services/crawler has not been scaffolded yet; skipping."; fi'

  lint:
    desc: lint services/crawler
    cmds:
      - 'if [ -f pyproject.toml ]; then uv run ruff check .; else echo "services/crawler has not been scaffolded yet; skipping."; fi'

  format:
    desc: format services/crawler
    cmds:
      - 'if [ -f pyproject.toml ]; then uv run ruff format .; else echo "services/crawler has not been scaffolded yet; skipping."; fi'

  format:check:
    desc: format:check services/crawler
    cmds:
      - 'if [ -f pyproject.toml ]; then uv run ruff format --check .; else echo "services/crawler has not been scaffolded yet; skipping."; fi'

  typecheck:
    desc: typecheck services/crawler
    cmds:
      - 'if [ -f pyproject.toml ]; then uv run pyright; else echo "services/crawler has not been scaffolded yet; skipping."; fi'

  test:
    desc: unit tests for services/crawler (no stack needed)
    cmds:
      - 'if [ -f pyproject.toml ]; then uv run pytest; else echo "services/crawler has not been scaffolded yet; skipping."; fi'

  test:integration:
    desc: Integration tests for services/crawler (needs `task stack:up`; uses a scratch database and bucket)
    cmds:
      - uv run pytest tests/integration

  run:
    desc: Run the crawler worker against the local stack (needs `task stack:up` and migrations applied)
    cmds:
      - "[ -f .env ] || cp .env.example .env"
      - uv run --env-file .env python -m crawler

  request:
    desc: "Publish a signed crawl.requested by hand, e.g. `task crawler:request -- cisa-kev none`"
    cmds:
      - "[ -f .env ] || cp .env.example .env"
      - uv run --env-file .env python -m crawler.request {{.CLI_ARGS}}
