version: '3'

tasks:
  setup:
    desc: setup services/pipeline
    cmds:
      - 'if [ -f pyproject.toml ]; then uv sync; else echo "services/pipeline has not been scaffolded yet; skipping."; fi'

  lint:
    desc: lint services/pipeline
    cmds:
      - 'if [ -f pyproject.toml ]; then uv run ruff check .; else echo "services/pipeline has not been scaffolded yet; skipping."; fi'

  format:
    desc: format services/pipeline
    cmds:
      - 'if [ -f pyproject.toml ]; then uv run ruff format .; else echo "services/pipeline has not been scaffolded yet; skipping."; fi'

  format:check:
    desc: format:check services/pipeline
    cmds:
      - 'if [ -f pyproject.toml ]; then uv run ruff format --check .; else echo "services/pipeline has not been scaffolded yet; skipping."; fi'

  typecheck:
    desc: typecheck services/pipeline
    cmds:
      - 'if [ -f pyproject.toml ]; then uv run pyright; else echo "services/pipeline has not been scaffolded yet; skipping."; fi'

  test:
    desc: unit tests for services/pipeline (no stack needed)
    cmds:
      - 'if [ -f pyproject.toml ]; then uv run pytest; else echo "services/pipeline has not been scaffolded yet; skipping."; fi'

  test:integration:
    desc: Integration tests for services/pipeline (needs `task stack:up`; uses a scratch database and bucket)
    cmds:
      - uv run pytest tests/integration

  run:
    desc: Run the SBOM validator against the local stack (needs `task stack:up`, migrations applied and `task stack:pipeline-role`)
    cmds:
      - "[ -f .env ] || cp .env.example .env"
      - uv run --env-file .env python -m pipeline

  normalize:run:
    desc: Run the vulnerability normalizer against the local stack (needs `task stack:up`, migrations applied and `task stack:normalizer-role`)
    cmds:
      - "[ -f .env ] || cp .env.example .env"
      - uv run --env-file .env python -m pipeline.normalize

  normalize:reprocess:
    desc: "Re-run normalization from the raw artifact: task pipeline:normalize:reprocess -- PyPI [--sha256 <hex>]"
    cmds:
      - "[ -f .env ] || cp .env.example .env"
      - uv run --env-file .env python -m pipeline.normalize.reprocess {{.CLI_ARGS}}

  normalize:cvss-backfill:
    desc: Backfill CVSS base scores for previously normalized advisories (migration 013 required)
    cmds:
      - "[ -f .env ] || cp .env.example .env"
      - uv run --env-file .env python -m pipeline.normalize.backfill_cvss {{.CLI_ARGS}}

  correlate:run:
    desc: Run the correlator (findings) against the local stack (needs `task stack:up`, migrations applied and `task stack:correlator-role`)
    cmds:
      - "[ -f .env ] || cp .env.example .env"
      - uv run --env-file .env python -m pipeline.correlate

  correlate:sweep:
    desc: Re-match every project now, ignoring the sweep interval (needs the same setup as correlate:run)
    cmds:
      - "[ -f .env ] || cp .env.example .env"
      - uv run --env-file .env python -m pipeline.correlate.sweep_now

  correlate:bench:
    desc: Time matching on a scratch database of real advisories and synthetic tenants (needs `task stack:up` and OSV dumps; see bench/correlate_bench.py)
    cmds:
      - uv run python bench/correlate_bench.py {{.CLI_ARGS}}

  group:run:
    desc: Run the advisory grouper (SENTRA-12; needs `task stack:up`, migrations applied and `task stack:grouper-role`). Add `-- --once` for a single pass
    cmds:
      - "[ -f .env ] || cp .env.example .env"
      - uv run --env-file .env python -m pipeline.group {{.CLI_ARGS}}
